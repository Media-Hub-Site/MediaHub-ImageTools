name: Build and Release MediaHub-ImageTools

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests
          pip install -r requirements.txt

      - name: Download Real-ESRGAN Models
        shell: pwsh
        run: |
          $modelsDir = "apps/models/realesrgan/models"
          if (!(Test-Path $modelsDir)) { New-Item -ItemType Directory -Path $modelsDir -Force }
          
          $baseUrl = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0"
          $files = @(
            "realesrgan-x4plus.bin",
            "realesrgan-x4plus.param",
            "realesrgan-x4plus-anime.bin",
            "realesrgan-x4plus-anime.param",
            "realesr-animevideov3-x2.bin",
            "realesr-animevideov3-x2.param",
            "realesr-animevideov3-x3.bin",
            "realesr-animevideov3-x3.param",
            "realesr-animevideov3-x4.bin",
            "realesr-animevideov3-x4.param"
          )
          
          foreach ($f in $files) {
            $dest = Join-Path $modelsDir $f
            if (!(Test-Path $dest)) {
              Write-Host "Downloading $f..."
              Invoke-WebRequest -Uri "$baseUrl/$f" -OutFile $dest
            }
          }
          Write-Host "Real-ESRGAN models ready for build."

      - name: Build Executable with PyInstaller
        run: pyinstaller main.spec

      - name: Compress Build to ZIP
        run: |
          Compress-Archive -Path "dist\MediaHub-ImageTools\*" -DestinationPath "MediaHub-ImageTools.zip" -Force

      - name: Generate Release Tag Name
        id: tag_name
        run: |
          if ("${{ github.ref }}" -match "refs/tags/") {
            echo "TAG=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            $date = Get-Date -Format "yyyyMMdd-HHmm"
            echo "TAG=v$date" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG }}
          name: MediaHub-ImageTools ${{ steps.tag_name.outputs.TAG }}
          files: |
            MediaHub-ImageTools.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

